name: glitch-snitch
fullName: GlitchSnitch
description: Welcome to GlitchSnitch, the hottest new bug bounty platform that promises
  payouts in 'exposure' and discounts on energy drinks.
categories:
- web
authors:
- DragonSec SI
flags:
- name: main
  body: development_in_production_oh_no
instancing: true
files:
- source/.dockerignore
- source/.gitignore
- source/backend/DB.js
- source/backend/helpers.js
- source/backend/index.js
- source/backend/package-lock.json
- source/backend/package.json
- public/docker-compose.yml
- source/Dockerfile
- source/frontend/.gitignore
- source/frontend/eslint.config.js
- source/frontend/index.html
- source/frontend/package-lock.json
- source/frontend/package.json
- source/frontend/src/App.tsx
- source/frontend/src/config.ts
- source/frontend/src/func.ts
- source/frontend/src/hooks/useFetch.ts
- source/frontend/src/hooks/useUser.ts
- source/frontend/src/LoginContext.tsx
- source/frontend/src/main.tsx
- source/frontend/src/MainNavigation.tsx
- source/frontend/src/pages/Dashboard.tsx
- source/frontend/src/pages/Login.tsx
- source/frontend/src/pages/Main.tsx
- source/frontend/src/pages/Register.tsx
- source/frontend/src/types.ts
- source/frontend/style.css
- source/frontend/tsconfig.app.json
- source/frontend/tsconfig.json
- source/frontend/tsconfig.node.json
- source/frontend/vite.config.ts
- source/nginx.conf
- source/start.sh
services:
- name: nginx
  image:
    type: dockerfile
    context: source
    path: Dockerfile.nginx
  ports:
  - name: http
    containerPort: 80
    type: http
    expose: true
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: frontend
    containerPort: 3000
    type: http
    expose: false
  - name: backend
    containerPort: 5000
    type: http
    expose: false
  flags:
  - name: main
    env: FLAG
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
