<!DOCTYPE html>
<html>
<head>
    <title>Company Directory</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container {
            max-width: 960px;
        }

        #searchForm {
            margin-bottom: 20px;
            justify-content: center;
            flex-direction: row;
        }

        #searchForm input[type="text"], select {
            padding: 5px;
            margin-right: 10px;
        }

        #searchForm input[type="submit"] {
            padding: 5px 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        p {
            text-align: center;
            color: #666;
        }

        .redacted {
            text-align: center;
            opacity: .8;
            font-style: italic;
            font-size: .8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Company Directory</h1>
        <p>If you need to reach out to any of our staff, you can find their contact information below</p>
        <form id="searchForm" method="GET">
            <input type="text" name="first_name" placeholder="First Name">
            <input type="text" name="last_name" placeholder="Last Name">
            <select name="department">
                <option value="">All departments</option>
                <option value="IT">IT</option>
                <option value="Marketing">Marketing</option>
                <option value="HR">HR</option>
                <option value="Customer service">Customer service</option>
            </select>
            <input type="submit" value="Search">
        </form>
        <div id="loadingIndicator" style="display:none;text-align: center;">Loading...</div>
        <div id="resultsContainer"></div>
    </div>
    <script src="/static/js/intranet.js"></script>
    <script src="/static/js/directory.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new DirectoryApp();
        });
    </script>
</body>
</html>
