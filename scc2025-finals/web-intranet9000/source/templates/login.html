<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intranet 9000</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container {
            max-width: 400px;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Intranet 9000</h1>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" name="employee_number" placeholder="Employee Number" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
        <div id="message"></div>
    </div>

    <script src="/static/js/intranet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const messageDiv = document.getElementById('message');
            const intranetApp = new IntranetApp();

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = new FormData(loginForm);
                const employeeNumber = formData.get('employee_number');
                const password = formData.get('password');

                if (!/^\d+$/.test(employeeNumber)) {
                    messageDiv.textContent = 'Employee Number must be a numeric value.';
                    return;
                }

                try {
                    await intranetApp.login(employeeNumber, password);
                    messageDiv.textContent = 'Login successful. Redirecting...';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } catch (error) {
                    console.error('Error:', error);
                    messageDiv.textContent = error.message || 'Login failed. Please try again.';
                }
            });
        });
    </script>
</body>
</html>
