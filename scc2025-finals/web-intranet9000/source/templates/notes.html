<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Notes</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        /* Additional styles specific to notes page */
        .container {
            width: 100%;
            max-width: 960px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #inner {
            display: flex;
            overflow: auto;
        }
        #notes-list {
            width: 30%;
            overflow-y: auto;
            border-right: 1px solid #ccc;
        }
        #note-content {
            width: 70%;
            overflow-y: auto;
            padding: 20px;
        }
        .note-item {
            cursor: pointer;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .note-item:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Intranet 9000 Notes</h1>
        <div id="inner">
            <div id="notes-list"></div>
            <div id="note-content"></div>
        </div>
    </div>
    <script src="/static/js/intranet.js"></script>
    <script src="/static/js/notes.js"></script>
</body>
</html>
