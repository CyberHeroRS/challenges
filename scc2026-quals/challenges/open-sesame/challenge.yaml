name: open-sesame
fullName: Open Sesame
description: 'When they came to the rock, the captain went up to it and said: ''Open Sesame!''

  Immediately the door opened, and the thieves entered the cave. When they had all gone in, the door closed again of itself.


  Note: Use ''http://localhost:3000'' as the target URL in your exploit.

  '
categories:
- web
authors:
- kodz
flags:
- name: flag
  body: C0OP_m0r3_l1kE_p00p!
instancing: true
