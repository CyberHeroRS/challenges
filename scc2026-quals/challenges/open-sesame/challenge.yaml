- public/routes/pages.js
- public/server.js
- public/static/img/bronze-idol.svg
- public/static/img/diamond-dagger.svg
- public/static/img/emerald-necklace.svg
- public/static/img/gold-coins.svg
- public/static/img/golden-lamp.svg
- public/static/img/pearl-strand.svg
- public/static/img/ruby-ring.svg
- public/static/img/sapphire-tiara.svg
- public/static/img/silver-chalice.svg
