name: the-matrix
fullName: The Matrix
description: 'You have been tasked to overturn the hidden matrix undeground forum. Good luck.

  '
categories:
- web
authors:
- Legasi
flags:
- name: flag1
  body: TH3_M4TRIX_3NTERED
  difficulty: easy
- name: flag2
  body: fr4m3_m4tr1x_br34ch
  difficulty: hard
instancing: true
files:
- source/Dockerfile
- source/README.md
- source/assets/app.js
- source/assets/style.css
- source/bot.js
- source/docker-compose.yml
- source/package-lock.json
- source/package.json
- source/src/bot.ts
- source/src/middleware/auth.ts
- source/src/routes.ts
- source/src/server.ts
- source/src/static/404.html
- source/src/static/assets/app.js
- source/src/static/assets/duty-status.js
- source/src/static/assets/style.css
- source/src/static/dashboard-monitor.html
- source/src/static/dashboard.html
- source/src/static/generate-token.html
- source/src/static/index.html
- source/src/static/new-post.html
- source/src/static/verify.html
- source/src/utils.ts
- source/tsconfig.json
services:
- name: the-matrix
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  flags:
  - name: flag1
    env: THREAD_FLAG
  - name: flag2
    env: BOT_FLAG_COOKIE_VALUE
  env:
  - name: BOT_ORIGIN
    value: http://localhost
  ports:
  - name: web
    containerPort: 3000
    expose: true
    type: http
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
