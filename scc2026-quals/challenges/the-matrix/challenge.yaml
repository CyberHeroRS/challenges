name: the-matrix
fullName: The Matrix
description: 'You have been tasked to overturn the hidden matrix undeground forum. Good luck.

  '
categories:
- web
authors:
- Legasi
flags:
- name: flag1
  body: SCC{TH3_M4TRIX_3NTERED}
  difficulty: easy
- name: flag2
  body: SCC{fr4m3_m4tr1x_br34ch}
  difficulty: hard
instancing: true
files:
- public/Dockerfile
- public/README.md
- public/assets/app.js
- public/assets/style.css
- public/bot.js
- public/docker-compose.yml
- public/package-lock.json
- public/package.json
- public/src/bot.ts
- public/src/middleware/auth.ts
- public/src/routes.ts
- public/src/server.ts
- public/src/static/404.html
- public/src/static/assets/app.js
- public/src/static/assets/duty-status.js
- public/src/static/assets/style.css
- public/src/static/dashboard-monitor.html
- public/src/static/dashboard.html
- public/src/static/generate-token.html
- public/src/static/index.html
- public/src/static/new-post.html
- public/src/static/verify.html
- public/src/utils.ts
- public/tsconfig.json
services:
- name: the-matrix
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  flags:
  - name: flag1
    env: THREAD_FLAG
  - name: flag2
    env: BOT_FLAG_COOKIE_VALUE
  ports:
  - name: web
    containerPort: 3000
    expose: true
    type: http
