<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>matrix://duty-verify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 10px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Mono",
          Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: #010805;
        color: #9cf8ba;
        font-size: 12px;
      }
      .panel {
        border-radius: 6px;
        border: 1px solid rgba(120, 255, 159, 0.6);
        padding: 8px 10px;
        background: #020b06;
      }
      .title {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .status-line {
        margin-top: 6px;
        font-size: 11px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(120, 255, 159, 0.4);
        border-top-color: rgba(120, 255, 159, 1);
        animation: spin 0.8s linear infinite;
        margin-right: 6px;
      }
      .row {
        display: flex;
        align-items: center;
      }
      .error {
        color: #ffb3b3;
      }
      .ok {
        color: #9cf8ba;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 10px;
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid rgba(120, 255, 159, 0.7);
        background: #03150b;
        color: #c0ffd4;
        font-size: 11px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="title">/duty-verify</div>
      <div class="row" id="progress-row">
        <div class="spinner" id="spinner"></div>
        <div id="progress-text">running security hash check...</div>
      </div>
      <div class="status-line" id="result-line"></div>
      <button id="close-btn" style="display: none">close</button>
    </div>

    <script>
      (function () {
        const spinner = document.getElementById("spinner");
        const progressText = document.getElementById("progress-text");
        const resultLine = document.getElementById("result-line");
        const closeBtn = document.getElementById("close-btn");

        function setResult(html) {
          resultLine.innerHTML = html;
        }

        function finish(autoCloseMs) {
          if (spinner) spinner.style.display = "none";
          if (progressText) progressText.textContent = "check complete.";
          if (closeBtn) {
            closeBtn.style.display = "inline-block";
            closeBtn.addEventListener("click", () => window.close());
          }
          if (typeof autoCloseMs === "number" && autoCloseMs > 0) {
            setTimeout(() => {
              try {
                window.close();
              } catch {
                // ignore
              }
            }, autoCloseMs);
          }
        }

        // Simulate admin hash verification using the existing session endpoint.
        fetch("/api/session")
          .then((res) => res.json())
          .then((data) => {
            const isAdmin =
              data &&
              data.authenticated &&
              (data.isAdmin === true ||
                (data.user && data.user.username === "admin"));

            setTimeout(() => {
              if (isAdmin && window.opener) {
                // Notify the opener that duty status is now ON.
                window.opener.postMessage(
                  {
                    type: "DUTY_STATUS",
                    on: true,
                  },
                  "*",
                );
                setResult(
                  '<span class="ok">admin hash verified. status set to ON DUTY.</span>',
                );
              } else {
                setResult(
                  '<span class="error">admin verification failed. duty status unchanged.</span>',
                );
              }
              // Hash check ~1.2s, then auto-close 2s later.
              finish(2000);
            }, 1200);
          })
          .catch(() => {
            setTimeout(() => {
              setResult(
                '<span class="error">hash check failed: network error.</span>',
              );
              // Network failure path closes a bit sooner.
              finish(2000);
            }, 900);
          });
      })();
    </script>
  </body>
  </html>
