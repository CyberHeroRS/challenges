<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>zion_vessel</title>
  </head>
  <body>
    <script>
      (async function () {
        var origin = window.location.origin;
        try {
          const res = await fetch("/api/admin-token");
          const data = await res.json();
          var token = data && data.token ? data.token : "";
          if (window.opener && token) {
            // Only deliver the token to a window on the same origin.
            window.opener.postMessage(
              {
                type: "TOKEN_DATA",
                value: token,
              },
              origin,
            );
          }
        } catch (e) {
          // ignore
        }
        // close the helper window after attempting to send the message
        window.close();
      })();
    </script>
  </body>
  </html>
