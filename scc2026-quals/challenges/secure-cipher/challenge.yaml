name: secure-cipher
fullName: Secure Cipher
description: 'Your phone will be fully secure!

  '
categories:
- pwn
authors:
- k4lizen
flags:
- name: flag
  body: aarch64IsTheBestArch
instancing: true
files:
- source/Dockerfile
- source/Makefile
- source/docker-compose.yml
- source/flag.txt
- source/run.sh
- source/secure-cipher
services:
- name: secure-cipher
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  flags:
  - name: flag
    env: FLAG
  ports:
  - name: shell
    containerPort: 1337
    expose: true
    type: netcat
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: source/secure-cipher
    target: /solution/secure-cipher
