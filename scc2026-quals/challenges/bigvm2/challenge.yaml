name: bigvm2
fullName: BigVM II
description: 'This is a continuation of the BigVM I challenge.


  Someone said that this virtual machine is flawed when executing arbitrary code. Can you write that malicious code and prove it?

  '
categories:
- pwn
authors:
- manjaro
flags:
- name: flag
  body: b1g_in73g3rs_4r3_34sy_70_0v3rfl0w
instancing: true
files:
- source/Dockerfile
- source/bigvm2
- source/docker-compose.yml
- source/glibc/ld-linux-x86-64.so.2
- source/glibc/libc.so.6
- source/glibc/libgcc_s.so.1
- source/glibc/libm.so.6
- source/glibc/libstdc++.so.6
- source/runner.py
services:
- name: bigvm2
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  flags:
  - name: flag
    env: FLAG
  ports:
  - name: shell
    containerPort: 1337
    expose: true
    type: netcat
# test: deliberately left unwired -- the checker's exploit.bin's gadget/
# system() offsets are stale against this exact shipped libc.so.6 (its
# .text starts at 0x28400 but the gadget offset used is 0x20334, outside
# any executable section) and crashes with SIGILL. See solution/ for the
# WIP re-derivation notes.
