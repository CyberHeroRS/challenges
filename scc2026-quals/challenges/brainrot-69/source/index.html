<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot 69</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: #eee;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4; }
            to { text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; }
        }
        .container {
            max-width: 95vw;
            overflow-x: auto;
            overflow-y: hidden;
            border: 4px solid #ff69b4;
            border-radius: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        img {
            display: block;
            height: auto;
            max-height: 360px;
            width: auto;
        }
        p {
            margin-top: 20px;
            font-size: 1.2em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🧠 Brainrot 69 🧠</h1>
    <div class="container">
        <img src="encoded.png" alt="Encoded Message">
    </div>
    <p>Tralalero Tralala 🐊</p>
</body>
</html>
