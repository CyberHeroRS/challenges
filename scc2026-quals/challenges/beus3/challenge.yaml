name: beus3
fullName: BEUS Level 3
description: 'The Binary Exploitation Unit of Serbia has prepared another level of their test for you. Is this the same as Level 2?

  '
categories:
- pwn
authors:
- manjaro
flags:
- name: flag
  body: r0p_is_s7r0ng3r_7h4n_4ny_s3cc0mp_rul3s
instancing: true
files:
- source/Dockerfile
- source/beus3
- source/docker-compose.yml
- source/ld-linux-x86-64.so.2
- source/libc.so.6
services:
- name: beus3
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  flags:
  - name: flag
    env: FLAG
  ports:
  - name: shell
    containerPort: 1337
    expose: true
    type: netcat
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: source/beus3
    target: /solution/beus3
  - source: source/libc.so.6
    target: /solution/libc.so.6
