name: SCC 2024 quals - Generate Images

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live-laugh-love
            context: scc2024-quals/challenges/live-laugh-love/source
            dockerfile: scc2024-quals/challenges/live-laugh-love/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/crypto-live-laugh-love

          - name: ghost-activity
            context: scc2024-quals/challenges/ghost-activity/source
            dockerfile: scc2024-quals/challenges/ghost-activity/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/forensics-ghost-activity

          - name: what-does-the-fox-say
            context: scc2024-quals/challenges/what-does-the-fox-say/source
            dockerfile: scc2024-quals/challenges/what-does-the-fox-say/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/forensics-what-does-the-fox-say

          - name: slaga1337za
            context: scc2024-quals/challenges/slaga1337za/source
            dockerfile: scc2024-quals/challenges/slaga1337za/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/misc-slaga1337za

          - name: ds-homework
            context: scc2024-quals/challenges/ds-homework/source
            dockerfile: scc2024-quals/challenges/ds-homework/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/pwn-ds-homework

          - name: efficient-todo
            context: scc2024-quals/challenges/efficient-todo/source
            dockerfile: scc2024-quals/challenges/efficient-todo/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/pwn-efficient-todo

          - name: hansel-and-gretel
            context: scc2024-quals/challenges/hansel-and-gretel/source
            dockerfile: scc2024-quals/challenges/hansel-and-gretel/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/pwn-hansel-and-gretel

          - name: kernel-buddy
            context: scc2024-quals/challenges/kernel-buddy/source
            dockerfile: scc2024-quals/challenges/kernel-buddy/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/pwn-kernel-buddy

          - name: outer-product
            context: scc2024-quals/challenges/outer-product/source
            dockerfile: scc2024-quals/challenges/outer-product/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/pwn-outer-product

          - name: serbian-rop
            context: scc2024-quals/challenges/serbian-rop/source
            dockerfile: scc2024-quals/challenges/serbian-rop/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/pwn-serbian-rop

          - name: wasm-mania
            context: scc2024-quals/challenges/wasm-mania/source
            dockerfile: scc2024-quals/challenges/wasm-mania/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/rev-wasm-mania

          - name: baby-pop-app
            context: scc2024-quals/challenges/baby-pop/source
            dockerfile: scc2024-quals/challenges/baby-pop/source/app.Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-baby-pop-app

          - name: baby-pop-db
            context: scc2024-quals/challenges/baby-pop/source
            dockerfile: scc2024-quals/challenges/baby-pop/source/db.Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-baby-pop-db

          - name: ecology
            context: scc2024-quals/challenges/ecology/source
            dockerfile: scc2024-quals/challenges/ecology/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-ecology

          - name: long-note
            context: scc2024-quals/challenges/long-note/source
            dockerfile: scc2024-quals/challenges/long-note/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-long-note

          - name: loooose
            context: scc2024-quals/challenges/loooose/source
            dockerfile: scc2024-quals/challenges/loooose/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-loooose

          - name: neglegentia
            context: scc2024-quals/challenges/neglegentia/source
            dockerfile: scc2024-quals/challenges/neglegentia/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-neglegentia

          - name: see-in-the-dark
            context: scc2024-quals/challenges/see-in-the-dark/source
            dockerfile: scc2024-quals/challenges/see-in-the-dark/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-see-in-the-dark

          - name: welcome2serbia
            context: scc2024-quals/challenges/welcome2serbia/source
            dockerfile: scc2024-quals/challenges/welcome2serbia/source/Dockerfile
            image: registry.ctf.rs/scc2024-quals/web-welcome2serbia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/ctf-build-and-push-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
