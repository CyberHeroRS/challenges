name: SCC 2025 finals - Push Challenges

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: scc2025-finals/challenges/fair-casino
          - dir: scc2025-finals/challenges/rsa2m
          - dir: scc2025-finals/challenges/xor-me-many-times

          - dir: scc2025-finals/challenges/0x1c200
          - dir: scc2025-finals/challenges/burn-it-down
          - dir: scc2025-finals/challenges/future-gadget-42-sanusb
          - dir: scc2025-finals/challenges/rusty-espionage

          - dir: scc2025-finals/challenges/bee-punctual
          - dir: scc2025-finals/challenges/forget-me-not
          - dir: scc2025-finals/challenges/monochrome

          - dir: scc2025-finals/challenges/notary
          - dir: scc2025-finals/challenges/shootingrange
          - dir: scc2025-finals/challenges/strcatenator

          - dir: scc2025-finals/challenges/is-this-java
          - dir: scc2025-finals/challenges/marathon
          - dir: scc2025-finals/challenges/wwwwww

          # - dir: scc2025-finals/web-git-bin
          # - dir: scc2025-finals/web-glitch-snitch
          - dir: scc2025-finals/challenges/intranet9000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push challenge
        uses: ./.github/actions/ctf-push-challenge
        with:
          challenge_dir: ${{ matrix.dir }}
