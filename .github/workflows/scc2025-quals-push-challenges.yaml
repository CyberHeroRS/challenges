name: SCC 2025 quals - Push Challenges

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: scc2025-quals/cry-hades
          - dir: scc2025-quals/cry-hades-ii
          - dir: scc2025-quals/cry-totally-fair-casino
          - dir: scc2025-quals/cry-verified-messages

          - dir: scc2025-quals/for-alarming-evidence
          - dir: scc2025-quals/for-cells-of-deception
          - dir: scc2025-quals/for-the-intruders-message
          - dir: scc2025-quals/for-unseen-breach

          - dir: scc2025-quals/hw-lost-in-pixels

          - dir: scc2025-quals/osint-grafijaguesser6
          - dir: scc2025-quals/osint-grafijaguesser7
          - dir: scc2025-quals/osint-grafijaguesser8
          - dir: scc2025-quals/osint-grafijaguesser9

          - dir: scc2025-quals/pwn-aop1
          - dir: scc2025-quals/pwn-beus-levelx
          - dir: scc2025-quals/pwn-dos1
          - dir: scc2025-quals/pwn-dos2
          - dir: scc2025-quals/pwn-storage
          - dir: scc2025-quals/pwn-toddler-jumble
          - dir: scc2025-quals/pwn-toddler-jumble2

          - dir: scc2025-quals/rev-clicker-revenge
          - dir: scc2025-quals/rev-discombobulation
          - dir: scc2025-quals/rev-raid
          - dir: scc2025-quals/rev-side-quest
          - dir: scc2025-quals/rev-sigill
          - dir: scc2025-quals/rev-snake-game
          - dir: scc2025-quals/rev-tiny-vm

          - dir: scc2025-quals/sanity-check

          - dir: scc2025-quals/web-audiocloud
          - dir: scc2025-quals/web-cyber-store
          - dir: scc2025-quals/web-doomer
          - dir: scc2025-quals/web-spyMe-level1
          - dir: scc2025-quals/web-spyMe-level2
          - dir: scc2025-quals/web-waffles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push challenge
        uses: ./.github/actions/ctf-push-challenge
        with:
          challenge_dir: ${{ matrix.dir }}
