name: SCC 2024 warmup - Push Challenges

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  push:
    runs-on: github-actions-cyberhero
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: scc2024-warmup/challenges/crossed
          - dir: scc2024-warmup/challenges/franco-greek
          - dir: scc2024-warmup/challenges/hexor
          - dir: scc2024-warmup/challenges/linearcongruencegamer
          - dir: scc2024-warmup/challenges/whack-a-mole-1
          - dir: scc2024-warmup/challenges/whack-a-mole-2
          - dir: scc2024-warmup/challenges/insecure-ftp-1
          - dir: scc2024-warmup/challenges/insecure-ftp-2
          - dir: scc2024-warmup/challenges/meta-hero
          - dir: scc2024-warmup/challenges/monkey-magic
          - dir: scc2024-warmup/challenges/spookymacro
          - dir: scc2024-warmup/challenges/weaponized-key
          - dir: scc2024-warmup/challenges/enchantment
          - dir: scc2024-warmup/challenges/gmq-accc
          - dir: scc2024-warmup/challenges/johnny
          - dir: scc2024-warmup/challenges/kalkulator
          - dir: scc2024-warmup/challenges/grafijaguesser-1
          - dir: scc2024-warmup/challenges/grafijaguesser-2
          - dir: scc2024-warmup/challenges/banana-shop
          - dir: scc2024-warmup/challenges/login-form
          - dir: scc2024-warmup/challenges/zork1-demo
          - dir: scc2024-warmup/challenges/javascript
          - dir: scc2024-warmup/challenges/password
          - dir: scc2024-warmup/challenges/pin
          - dir: scc2024-warmup/challenges/serial
          - dir: scc2024-warmup/challenges/art
          - dir: scc2024-warmup/challenges/hidden-cat
          - dir: scc2024-warmup/challenges/anatomy
          - dir: scc2024-warmup/challenges/blind-luck
          - dir: scc2024-warmup/challenges/flags4everyone
          - dir: scc2024-warmup/challenges/shinobi
          - dir: scc2024-warmup/challenges/shortnote

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push challenge
        uses: ./.github/actions/ctf-push-challenge
        with:
          challenge_dir: ${{ matrix.dir }}
