name: SCC 2024 quals - Push Challenges

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: scc2024-quals/challenges/bitten
          - dir: scc2024-quals/challenges/live-laugh-love
          - dir: scc2024-quals/challenges/nonsense
          - dir: scc2024-quals/challenges/rsapq
          - dir: scc2024-quals/challenges/solar-ellipse
          - dir: scc2024-quals/challenges/the-three-encryption-problem

          - dir: scc2024-quals/challenges/ghost-activity
          - dir: scc2024-quals/challenges/ghostwriter-mystery
          - dir: scc2024-quals/challenges/rocket-science
          - dir: scc2024-quals/challenges/space-echoes
          - dir: scc2024-quals/challenges/spookier-macro
          - dir: scc2024-quals/challenges/vacation-nightmare
          - dir: scc2024-quals/challenges/what-does-the-fox-say

          - dir: scc2024-quals/challenges/alien-communication
          - dir: scc2024-quals/challenges/slaga1337za

          - dir: scc2024-quals/challenges/grafija-guessr-1
          - dir: scc2024-quals/challenges/grafija-guessr-2
          - dir: scc2024-quals/challenges/grafija-guessr-3

          - dir: scc2024-quals/challenges/ds-homework
          - dir: scc2024-quals/challenges/efficient-todo
          - dir: scc2024-quals/challenges/hansel-and-gretel
          - dir: scc2024-quals/challenges/kernel-buddy
          - dir: scc2024-quals/challenges/outer-product
          - dir: scc2024-quals/challenges/serbian-rop

          - dir: scc2024-quals/challenges/clicker-game
          - dir: scc2024-quals/challenges/cxorruption
          - dir: scc2024-quals/challenges/elf-patrol
          - dir: scc2024-quals/challenges/junkyard
          - dir: scc2024-quals/challenges/riscy-encryptor
          - dir: scc2024-quals/challenges/vmderful
          - dir: scc2024-quals/challenges/wasm-mania

          - dir: scc2024-quals/challenges/baby-pop
          - dir: scc2024-quals/challenges/ecology
          - dir: scc2024-quals/challenges/long-note
          - dir: scc2024-quals/challenges/loooose
          - dir: scc2024-quals/challenges/neglegentia
          - dir: scc2024-quals/challenges/see-in-the-dark
          - dir: scc2024-quals/challenges/welcome2serbia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push challenge
        uses: ./.github/actions/ctf-push-challenge
        with:
          challenge_dir: ${{ matrix.dir }}
