name: SCC 2025 warmup - Generate Images

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cards-act-ii
            context: scc2025-warmup/challenges/cards-act-ii/source
            dockerfile: scc2025-warmup/challenges/cards-act-ii/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/cry-cards-act-ii

          - name: secpwdgen
            context: scc2025-warmup/challenges/secpwdgen/source
            dockerfile: scc2025-warmup/challenges/secpwdgen/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/misc-secpwdgen

          - name: beus-level1
            context: scc2025-warmup/challenges/beus-level1/source
            dockerfile: scc2025-warmup/challenges/beus-level1/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/pwn-beus-level1

          - name: beus-level2
            context: scc2025-warmup/challenges/beus-level2/source
            dockerfile: scc2025-warmup/challenges/beus-level2/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/pwn-beus-level2

          - name: cards
            context: scc2025-warmup/challenges/cards/source
            dockerfile: scc2025-warmup/challenges/cards/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/pwn-cards

          - name: fancy-restaurant
            context: scc2025-warmup/challenges/fancy-restaurant/source
            dockerfile: scc2025-warmup/challenges/fancy-restaurant/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/pwn-fancy-restaurant

          - name: maze-simulation
            context: scc2025-warmup/challenges/maze-simulation/source
            dockerfile: scc2025-warmup/challenges/maze-simulation/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/pwn-maze-simulation

          - name: im-a-spy-ama
            context: scc2025-warmup/challenges/im-a-spy-ama/source
            dockerfile: scc2025-warmup/challenges/im-a-spy-ama/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/web-im-a-spy-ama

          - name: len5
            context: scc2025-warmup/challenges/len5/source
            dockerfile: scc2025-warmup/challenges/len5/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/web-len5

          - name: pill-challenge
            context: scc2025-warmup/challenges/pill-challenge/source
            dockerfile: scc2025-warmup/challenges/pill-challenge/source/Dockerfile
            image: registry.ctf.rs/scc2025-warmup/web-pill-challenge

          # ---- multi-image challenges ----

          - name: cross-app
            context: scc2025-warmup/challenges/cross/source
            dockerfile: scc2025-warmup/challenges/cross/source/Dockerfile.app
            image: registry.ctf.rs/scc2025-warmup/web-cross-app

          - name: cross-bot
            context: scc2025-warmup/challenges/cross/source
            dockerfile: scc2025-warmup/challenges/cross/source/Dockerfile.bot
            image: registry.ctf.rs/scc2025-warmup/web-cross-bot

          - name: flag-the-query-app
            context: scc2025-warmup/challenges/flag-the-query/source
            dockerfile: scc2025-warmup/challenges/flag-the-query/source/Dockerfile.app
            image: registry.ctf.rs/scc2025-warmup/web-flag-the-query-app

          - name: flag-the-query-db
            context: scc2025-warmup/challenges/flag-the-query/source
            dockerfile: scc2025-warmup/challenges/flag-the-query/source/Dockerfile.db
            image: registry.ctf.rs/scc2025-warmup/web-flag-the-query-db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/ctf-build-and-push-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
