name: SCC 2025 warmup - Push Challenges

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: scc2025-warmup/challenges/cards-act-ii
          - dir: scc2025-warmup/challenges/exponents
          - dir: scc2025-warmup/challenges/gods-and-monsters
          - dir: scc2025-warmup/challenges/lets-create-generators
          - dir: scc2025-warmup/challenges/lets-create-generators-again
          - dir: scc2025-warmup/challenges/secret-archives
          - dir: scc2025-warmup/challenges/secpwdgen
          - dir: scc2025-warmup/challenges/beus-level1
          - dir: scc2025-warmup/challenges/beus-level2
          - dir: scc2025-warmup/challenges/cards
          - dir: scc2025-warmup/challenges/fancy-restaurant
          - dir: scc2025-warmup/challenges/maze-simulation
          - dir: scc2025-warmup/challenges/encryptor
          - dir: scc2025-warmup/challenges/mamba
          - dir: scc2025-warmup/challenges/vault
          - dir: scc2025-warmup/challenges/cross
          - dir: scc2025-warmup/challenges/flag-the-query
          - dir: scc2025-warmup/challenges/im-a-spy-ama
          - dir: scc2025-warmup/challenges/len5
          - dir: scc2025-warmup/challenges/pill-challenge
          - dir: scc2025-warmup/challenges/hello-world

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push challenge
        uses: ./.github/actions/ctf-push-challenge
        with:
          challenge_dir: ${{ matrix.dir }}
