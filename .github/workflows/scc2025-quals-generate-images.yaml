name: SCC 2025 quals - Generate Images

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hades
            context: scc2025-quals/challenges/hades/source
            dockerfile: scc2025-quals/challenges/hades/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-hades

          - name: hades-ii
            context: scc2025-quals/challenges/hades-ii/source
            dockerfile: scc2025-quals/challenges/hades-ii/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-hades-ii

          - name: totally-fair-casino
            context: scc2025-quals/challenges/totally-fair-casino/source
            dockerfile: scc2025-quals/challenges/totally-fair-casino/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-totally-fair-casino

          - name: verified-messages
            context: scc2025-quals/challenges/verified-messages/source
            dockerfile: scc2025-quals/challenges/verified-messages/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-verified-messages

          - name: alarming-evidence
            context: scc2025-quals/challenges/alarming-evidence/source
            dockerfile: scc2025-quals/challenges/alarming-evidence/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/for-alarming-evidence

          - name: aop1
            context: scc2025-quals/challenges/aop1/source
            dockerfile: scc2025-quals/challenges/aop1/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-aop1

          - name: beus-levelx
            context: scc2025-quals/challenges/beus-levelx/source
            dockerfile: scc2025-quals/challenges/beus-levelx/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-beus-levelx

          - name: dos1
            context: scc2025-quals/challenges/dos1/source
            dockerfile: scc2025-quals/challenges/dos1/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-dos1

          - name: dos2
            context: scc2025-quals/challenges/dos2/source
            dockerfile: scc2025-quals/challenges/dos2/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-dos2

          - name: storage
            context: scc2025-quals/challenges/storage/source
            dockerfile: scc2025-quals/challenges/storage/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-storage

          - name: toddler-jumble
            context: scc2025-quals/challenges/toddler-jumble/source
            dockerfile: scc2025-quals/challenges/toddler-jumble/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-toddler-jumble

          - name: toddler-jumble2
            context: scc2025-quals/challenges/toddler-jumble2/source
            dockerfile: scc2025-quals/challenges/toddler-jumble2/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-toddler-jumble2

          - name: audiocloud
            context: scc2025-quals/challenges/audiocloud/source
            dockerfile: scc2025-quals/challenges/audiocloud/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-audiocloud

          - name: cyber-store
            context: scc2025-quals/challenges/cyber-store/source
            dockerfile: scc2025-quals/challenges/cyber-store/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-cyber-store

          # ---- multi-image challenges ----

          - name: doomer-web
            context: scc2025-quals/challenges/doomer/source
            dockerfile: scc2025-quals/challenges/doomer/source/Dockerfile.web
            image: registry.ctf.rs/scc2025-quals/web-doomer-web

          - name: doomer-bot
            context: scc2025-quals/challenges/doomer/source
            dockerfile: scc2025-quals/challenges/doomer/source/Dockerfile.bot
            image: registry.ctf.rs/scc2025-quals/web-doomer-bot

          - name: doomer-db
            context: scc2025-quals/challenges/doomer/source
            dockerfile: scc2025-quals/challenges/doomer/source/Dockerfile.db
            image: registry.ctf.rs/scc2025-quals/web-doomer-db

          - name: spy-me-level1-web
            context: scc2025-quals/challenges/spy-me-level1/source
            dockerfile: scc2025-quals/challenges/spy-me-level1/source/Dockerfile.web
            image: registry.ctf.rs/scc2025-quals/web-spy-me-level1-web

          - name: spy-me-level1-bot
            context: scc2025-quals/challenges/spy-me-level1/source
            dockerfile: scc2025-quals/challenges/spy-me-level1/source/Dockerfile.bot
            image: registry.ctf.rs/scc2025-quals/web-spy-me-level1-bot

          - name: spy-me-level1-db
            context: scc2025-quals/challenges/spy-me-level1/source
            dockerfile: scc2025-quals/challenges/spy-me-level1/source/Dockerfile.db
            image: registry.ctf.rs/scc2025-quals/web-spy-me-level1-db

          - name: waffles-waf
            context: scc2025-quals/challenges/waffles/source/waf
            dockerfile: scc2025-quals/challenges/waffles/source/waf/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-waffles-waf

          - name: waffles-app
            context: scc2025-quals/challenges/waffles/source/waffles
            dockerfile: scc2025-quals/challenges/waffles/source/waffles/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-waffles-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/ctf-build-and-push-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
