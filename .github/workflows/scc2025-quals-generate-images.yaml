name: SCC 2025 quals - Generate Images

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cry-hades
            context: scc2025-quals/cry-hades/source
            dockerfile: scc2025-quals/cry-hades/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-hades

          - name: cry-hades-ii
            context: scc2025-quals/cry-hades-ii/source
            dockerfile: scc2025-quals/cry-hades-ii/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-hades-ii

          - name: cry-totally-fair-casino
            context: scc2025-quals/cry-totally-fair-casino/source
            dockerfile: scc2025-quals/cry-totally-fair-casino/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-totally-fair-casino

          - name: cry-verified-messages
            context: scc2025-quals/cry-verified-messages/source
            dockerfile: scc2025-quals/cry-verified-messages/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/cry-verified-messages

          - name: for-alarming-evidence
            context: scc2025-quals/for-alarming-evidence/source
            dockerfile: scc2025-quals/for-alarming-evidence/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/for-alarming-evidence

          - name: pwn-aop1
            context: scc2025-quals/pwn-aop1/source
            dockerfile: scc2025-quals/pwn-aop1/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-aop1

          - name: pwn-beus-levelx
            context: scc2025-quals/pwn-beus-levelx/source
            dockerfile: scc2025-quals/pwn-beus-levelx/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-beus-levelx

          - name: pwn-dos1
            context: scc2025-quals/pwn-dos1/source
            dockerfile: scc2025-quals/pwn-dos1/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-dos1

          - name: pwn-dos2
            context: scc2025-quals/pwn-dos2/source
            dockerfile: scc2025-quals/pwn-dos2/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-dos2

          - name: pwn-storage
            context: scc2025-quals/pwn-storage/source
            dockerfile: scc2025-quals/pwn-storage/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-storage

          - name: pwn-toddler-jumble
            context: scc2025-quals/pwn-toddler-jumble/source
            dockerfile: scc2025-quals/pwn-toddler-jumble/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-toddler-jumble

          - name: pwn-toddler-jumble2
            context: scc2025-quals/pwn-toddler-jumble2/source
            dockerfile: scc2025-quals/pwn-toddler-jumble2/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/pwn-toddler-jumble2

          - name: web-audiocloud
            context: scc2025-quals/web-audiocloud/source
            dockerfile: scc2025-quals/web-audiocloud/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-audiocloud

          - name: web-cyber-store
            context: scc2025-quals/web-cyber-store/source
            dockerfile: scc2025-quals/web-cyber-store/source/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-cyber-store

          # ---- multi-image challenges ----

          - name: web-doomer-web
            context: scc2025-quals/web-doomer/source
            dockerfile: scc2025-quals/web-doomer/source/Dockerfile.web
            image: registry.ctf.rs/scc2025-quals/web-doomer-web

          - name: web-doomer-bot
            context: scc2025-quals/web-doomer/source
            dockerfile: scc2025-quals/web-doomer/source/Dockerfile.bot
            image: registry.ctf.rs/scc2025-quals/web-doomer-bot

          - name: web-doomer-db
            context: scc2025-quals/web-doomer/source
            dockerfile: scc2025-quals/web-doomer/source/Dockerfile.db
            image: registry.ctf.rs/scc2025-quals/web-doomer-db

          - name: web-spyMe-level1-web
            context: scc2025-quals/web-spyMe-level1/source
            dockerfile: scc2025-quals/web-spyMe-level1/source/Dockerfile.web
            image: registry.ctf.rs/scc2025-quals/web-spyMe-level1-web

          - name: web-spyMe-level1-bot
            context: scc2025-quals/web-spyMe-level1/source
            dockerfile: scc2025-quals/web-spyMe-level1/source/Dockerfile.bot
            image: registry.ctf.rs/scc2025-quals/web-spyMe-level1-bot

          - name: web-spyMe-level1-db
            context: scc2025-quals/web-spyMe-level1/source
            dockerfile: scc2025-quals/web-spyMe-level1/source/Dockerfile.db
            image: registry.ctf.rs/scc2025-quals/web-spyMe-level1-db

          - name: web-waffles-waf
            context: scc2025-quals/web-waffles/source/waf
            dockerfile: scc2025-quals/web-waffles/source/waf/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-waffles-waf

          - name: web-waffles-app
            context: scc2025-quals/web-waffles/source/waffles
            dockerfile: scc2025-quals/web-waffles/source/waffles/Dockerfile
            image: registry.ctf.rs/scc2025-quals/web-waffles-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/ctf-build-and-push-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
