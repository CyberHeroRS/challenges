name: SCC 2024 warmup - Generate Images

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: github-actions-cyberhero
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: whack-a-mole-1
            context: scc2024-warmup/challenges/whack-a-mole-1/source
            dockerfile: scc2024-warmup/challenges/whack-a-mole-1/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/crypto-whack-a-mole-1

          - name: gmq-accc
            context: scc2024-warmup/challenges/gmq-accc/source
            dockerfile: scc2024-warmup/challenges/gmq-accc/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/misc-gmq-accc

          - name: kalkulator
            context: scc2024-warmup/challenges/kalkulator/source
            dockerfile: scc2024-warmup/challenges/kalkulator/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/misc-kalkulator

          - name: banana-shop
            context: scc2024-warmup/challenges/banana-shop/source
            dockerfile: scc2024-warmup/challenges/banana-shop/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/pwn-banana-shop

          - name: login-form
            context: scc2024-warmup/challenges/login-form/source
            dockerfile: scc2024-warmup/challenges/login-form/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/pwn-login-form

          - name: zork1-demo
            context: scc2024-warmup/challenges/zork1-demo/source
            dockerfile: scc2024-warmup/challenges/zork1-demo/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/pwn-zork1-demo

          - name: anatomy
            context: scc2024-warmup/challenges/anatomy/source
            dockerfile: scc2024-warmup/challenges/anatomy/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/web-anatomy

          - name: blind-luck
            context: scc2024-warmup/challenges/blind-luck/source
            dockerfile: scc2024-warmup/challenges/blind-luck/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/web-blind-luck

          - name: flags4everyone
            context: scc2024-warmup/challenges/flags4everyone/source
            dockerfile: scc2024-warmup/challenges/flags4everyone/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/web-flags4everyone

          - name: shinobi
            context: scc2024-warmup/challenges/shinobi/source
            dockerfile: scc2024-warmup/challenges/shinobi/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/web-shinobi

          - name: shortnote
            context: scc2024-warmup/challenges/shortnote/source
            dockerfile: scc2024-warmup/challenges/shortnote/source/Dockerfile
            image: registry.ctf.rs/scc2024-warmup/web-shortnote

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/ctf-build-and-push-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
