name: SCC 2025 finals - Generate Images

on:
  workflow_call:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: github-actions-cyberhero

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fair-casino
            context: scc2025-finals/challenges/fair-casino/source
            dockerfile: scc2025-finals/challenges/fair-casino/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/crypto-fair-casino

          - name: xor-me-many-times
            context: scc2025-finals/challenges/xor-me-many-times/source
            dockerfile: scc2025-finals/challenges/xor-me-many-times/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/crypto-xor-me-many-times

          - name: bee-punctual
            context: scc2025-finals/challenges/bee-punctual/source
            dockerfile: scc2025-finals/challenges/bee-punctual/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/misc-bee-punctual

          - name: notary
            context: scc2025-finals/challenges/notary/source
            dockerfile: scc2025-finals/challenges/notary/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/pwn-notary

          - name: shootingrange
            context: scc2025-finals/challenges/shootingrange/source
            dockerfile: scc2025-finals/challenges/shootingrange/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/pwn-shootingrange

          - name: strcatenator
            context: scc2025-finals/challenges/strcatenator/source
            dockerfile: scc2025-finals/challenges/strcatenator/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/pwn-strcatenator

          - name: is-this-java
            context: scc2025-finals/challenges/is-this-java/source
            dockerfile: scc2025-finals/challenges/is-this-java/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/rev-is-this-java

          - name: wwwwww
            context: scc2025-finals/challenges/wwwwww/source
            dockerfile: scc2025-finals/challenges/wwwwww/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/rev-wwwwww

          - name: git-bin
            context: scc2025-finals/challenges/git-bin/source
            dockerfile: scc2025-finals/challenges/git-bin/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/web-git-bin

          # ---- web-glitch-snitch is multi-image ----
          - name: glitch-snitch
            context: scc2025-finals/challenges/glitch-snitch/source
            dockerfile: scc2025-finals/challenges/glitch-snitch/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/web-glitch-snitch

          - name: glitch-snitch-backend
            context: scc2025-finals/challenges/glitch-snitch/source
            dockerfile: scc2025-finals/challenges/glitch-snitch/source/Dockerfile.backend
            image: registry.ctf.rs/scc2025-finals/web-glitch-snitch-backend

          - name: glitch-snitch-frontend
            context: scc2025-finals/challenges/glitch-snitch/source
            dockerfile: scc2025-finals/challenges/glitch-snitch/source/Dockerfile.frontend
            image: registry.ctf.rs/scc2025-finals/web-glitch-snitch-frontend

          # ---- web-intranet9000 is multi-image ----
          - name: intranet9000
            context: scc2025-finals/challenges/intranet9000/source
            dockerfile: scc2025-finals/challenges/intranet9000/source/Dockerfile
            image: registry.ctf.rs/scc2025-finals/web-intranet9000

          - name: intranet9000-mongo
            context: scc2025-finals/challenges/intranet9000/source
            dockerfile: scc2025-finals/challenges/intranet9000/source/Dockerfile.mongo
            image: registry.ctf.rs/scc2025-finals/web-intranet9000-mongo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push image
        uses: ./.github/actions/ctf-build-and-push-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
