name: ctf push challenge
description: "Publish one challenge directory (containing challenge.yml) to CTFd via ctfcli, reading token from Vault."

inputs:
  challenge_dir:
    description: "Directory containing challenge.yml"
    required: true

  ctfd_url:
    description: "Base URL of the CTFd instance"
    required: false
    default: "https://playground.cyberhero.rs/"

  ctfcli_version:
    description: "Pinned ctfcli version"
    required: false
    default: "0.1.6"

runs:
  using: "composite"
  steps:
    - name: Install packaging deps (zip)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y zip

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ctfcli
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "ctfcli==${{ inputs.ctfcli_version }}"

    - name: Run package.sh if present
      shell: bash
      run: |
        set -euo pipefail
        CHAL_DIR="${{ inputs.challenge_dir }}"

        echo "Entering challenge dir: $CHAL_DIR"
        cd "$CHAL_DIR"

        if [ -f "./package.sh" ]; then
          echo "package.sh found, executing..."
          chmod +x ./package.sh
          ./package.sh
        else
          echo "No package.sh found, skipping packaging step."
        fi

    - name: Get playground token
      id: vault
      uses: hashicorp/vault-action@v3
      with:
        url: http://vault.vault:8200
        method: kubernetes
        kubernetesTokenPath: /var/run/secrets/vault/token
        role: arc-github-actions-cyberhero-runner
        secrets: |
          cluster/data/cyberhero/playground/token TOKEN | CTFD_TOKEN

    - name: Publish challenge (sync, fallback to install)
      shell: bash
      env:
        CTFD_URL: ${{ inputs.ctfd_url }}
        CTFD_TOKEN: ${{ steps.vault.outputs.CTFD_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s\n%s\ny\n' "$CTFD_URL" "$CTFD_TOKEN" | ctf init
        if ! ctf challenge sync "${{ inputs.challenge_dir }}"; then
          ctf challenge install "${{ inputs.challenge_dir }}"
        fi
