name: toddler-jumble
fullName: Toddler Jumble
description: Easiest challenge I've ever seen
categories:
- pwn
authors:
- k4
flags:
- name: main
  body: even_a_baby_could_solve_this
instancing: true
files:
- source/libc.so.6
- source/ld-linux-x86-64.so.2
- public/Dockerfile
- build://participant/chal
- source/docker-compose.yaml
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1337
    type: netcat
    expose: true
  flags:
  - name: main
    file: /home/user/flag
build:
- name: participant
  image:
    type: dockerfile
    context: source
    path: Dockerfile
    target: participant
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: build://participant/chal
    target: /solution/chal
