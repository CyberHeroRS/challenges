name: doomer
fullName: Doomer
description: 'To be honest I have a doom scrolling addiction...


  *Note:* The flag consists of only lowercase alphanumerics to save you some time
  for more scrolling :)


  **Note 2**: When sending URLs to the admin bot, use http://web:1337 instead of the
  public URL.'
