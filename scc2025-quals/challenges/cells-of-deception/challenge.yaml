name: cells-of-deception
fullName: Cells of Deception
description: Recently, your organization discovered unusual behavior on multiple systems.
  After a thorough investigation, the team traced a series of suspicious activities
  back to an Excel document found on a compromised workstation. Alarmed by unauthorized
  network connections and unexpected file modifications, forensic experts quickly
  isolated the file for closer examination. They believe its contents may hold vital
  clues about the nature of the intrusion. Now, it's up to you to examine every cell,
  uncover hidden clues, and piece together the mystery behind this attack.
