name: beus-levelx
fullName: BEUS Level X
description: The Binary Exploitation Unit of Serbia has prepared another level of
  their test for you, and it feels very familiar.
categories:
- pwn
authors:
- m4njaro
flags:
- name: main
  body: r37urn1n6_70_l1bc_15_345y_50lv3
instancing: true
files:
- build://participant/beusX
- source/glibc/libc-2.31.so
- source/glibc/libc.so.6
- source/glibc/ld-2.31.so
- source/docker-compose.yml
- public/Dockerfile
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1337
    type: netcat
    expose: true
  flags:
  - name: main
    file: /home/user/flag
build:
- name: participant
  image:
    type: dockerfile
    context: source
    path: Dockerfile
    target: participant
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: build://participant/beusX
    target: /solution/beusX
  - source: source/glibc/libc-2.31.so
    target: /solution/libc-2.31.so
