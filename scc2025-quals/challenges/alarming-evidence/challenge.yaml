name: alarming-evidence
fullName: Alarming Evidence
description: DING! DING! DING! The sudden, unsettling sound reverberated through the
  office, sending everyone into a state of alarm. A newly installed security alert
  had been triggered by an intruder on one of Infinity Security Solutions' servers.
  Within moments, the forensic team raced to the server room, disconnected the compromised
  system from the network, and extracted its logs. They've archived everything and
  handed it over to you for further investigation. Can you examine the logs, identify
  whether an attack took place, and, if so, figure out the attacker's objective by
  answering a series of critical questions? The fate of this investigation rests in
  your hands.
categories:
- foren
authors:
- gordic
flags:
- name: main
  body: 4l4rm_tr1gg3r3d_intrus10n_c0nfirm3d
instancing: true
files:
- public/access.log
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1501
    type: netcat
    expose: true
  flags:
  - name: main
    env: FLAG
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: public/access.log
    target: /solution/access.log
