name: the-intruders-message
fullName: The Intruder's Message
description: It was a bright, sunny morning when Cyber Hero, an experienced security
  analyst at Infinity Security Solutions, was jolted awake by his phone’s ringtone.
  On the other end was his longtime friend Andrew, who sounded uneasy. Andrew quickly
  explained that something was off with their network and urged Cyber Hero to check
  his email immediately. Without hesitation, Cyber Hero dashed to his laptop, only
  to find a very strange email waiting for him. Now, he has turned to you, a cybersecurity
  expert, to help protect his network. The fate of his system rests in your hands.
