services:
- name: web
  image:
    type: dockerfile
    context: source
    path: Dockerfile.web
  env: &id001
  - name: MYSQL_HOST
    value: db
  - name: MYSQL_USER
    value: spyme
  - name: MYSQL_PASSWORD
    value: spyme123
  - name: MYSQL_DATABASE
    value: spyme
  ports:
  - name: http
    containerPort: 3000
    type: http
    expose: true
  flags:
  - name: main
    env: FLAG1
- name: admin-bot
  image:
    type: dockerfile
    context: source
    path: Dockerfile.bot
  env: *id001
  ports:
  - name: http
    containerPort: 3001
    type: http
    expose: false
- name: db
  image:
    type: dockerfile
    context: source
    path: Dockerfile.db
  env:
  - name: MYSQL_ROOT_PASSWORD
    value: root
  - name: MYSQL_DATABASE
    value: spyme
  - name: MYSQL_USER
    value: spyme
  - name: MYSQL_PASSWORD
    value: spyme123
  ports:
  - name: mysql
    containerPort: 3306
    type: netcat
    expose: false
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
