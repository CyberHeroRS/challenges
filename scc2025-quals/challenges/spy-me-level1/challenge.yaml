name: spy-me-level1
fullName: SpyMe Level 1
description: A secret espionage operation is unfolding in the Balkans, aiming to influence
  regional governments. We've gained access to their internal platform. Can you infiltrate
  their system and retrieve information from the spies' accounts?
categories:
- web
authors:
- DreyAnd
flags:
- name: main
  body: th0s3_g0dd4Mn_S3rbS!
instancing: true
files:
- source/src/whitelist/spy_icvorovic.json
- source/src/whitelist/spy_admin.json
- source/src/whitelist/spy_mnikic.json
- source/src/middleware/auth.js
- source/src/db.js
- source/src/utils.js
- source/src/controllers.js
- source/src/index.js
- source/src/routes.js
- source/views/src/App.js
- source/views/src/context/AuthContext.js
- source/views/src/index.js
