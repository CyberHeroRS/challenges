version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "3000:3000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=spyme
      - MYSQL_PASSWORD=spyme123
      - MYSQL_DATABASE=spyme
      - FLAG1=FAKE{this_is_a_fake_flag1}
      - FLAG2=FAKE{this_is_a_fake_flag2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "3001:3001"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=spyme
      - MYSQL_PASSWORD=spyme123
      - MYSQL_DATABASE=spyme
    depends_on:
      - web
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    #command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=spyme
      - MYSQL_USER=spyme
      - MYSQL_PASSWORD=spyme123
    # volumes:
    #   - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # tmpfs:
    #   - /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "spyme",
          "-pspyme123",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
