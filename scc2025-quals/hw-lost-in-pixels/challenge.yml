name: "Lost in the Pixels"
author: "Vucko"
attribution: "Vucko"
category: hardware
description: "A mysterious device has been discovered at the heart of a classified research lab. The device appears to be a simple embedded system, but something isn’t quite right. It seems like it was meant to display critical data on a small I2C screen, but the data was never meant to be seen by the human eye."
value: 500
type: dynamic
extra:
    initial: 500
    decay: 20
    minimum: 50
    function: logarithmic
flags:
    - SCC{i2c_ssd1306}
tags:
    - scc2025-quals
    - easy
files:
    - ./public/dump.sr
    - ./public/hw-lost-in-pixels.jpg
