<!doctype html>
<html>
  <head>
    <title>Waffle Gallery</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css"
    />
  </head>
  <body>
    <div class="ui container" style="padding-top: 2em">
      <h1 class="ui header">Waffle Gallery</h1>

      <div class="ui three cards">
        {% for waffle in waffles %}
        <div class="card">
          <div class="image">
            <img
              src="{{ url_for('static', filename=waffle.image) }}"
              alt="{{ waffle.name }}"
            />
          </div>
          <div class="content">
            <div class="header">{{ waffle.name }}</div>
            <div class="description">{{ waffle.description }}</div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.js"></script>
  </body>
</html>
