name: welcome2serbia
fullName: Welcome2Serbia
description: Discover Serbia through our website, designed for visitors. We opted
  for files instead of a database for simplicity. It's secure, right?
categories:
- web
authors:
- gordic
flags:
- name: main
  body: W3Lc0m3_70_7h3_LAnD_0F_h1570RY_and_CUl7uR3
instancing: true
files:
- source/src/cities/Belgrade.txt
- public/src/cities/Jagodina.txt
- public/src/cities/Nis.txt
- public/src/cities/NoviSad.txt
- public/src/flag.txt
- public/src/server.py
- source/src/static/belgrade.jpg
- source/src/static/belgrade.png
- source/src/static/bg.jpg
- source/src/static/bg1.jpg
- source/src/static/jagodina.jpg
- source/src/static/jagodina.png
- source/src/static/nis.jpg
- source/src/static/nis.png
- source/src/static/novisad.jpg
- source/src/static/novisad.png
- public/src/static/styles.css
- public/src/templates/city.html
- public/src/templates/index.html
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 3500
    type: http
    expose: true
  flags:
  - name: main
    file: /usr/src/app/flag.txt
test:
