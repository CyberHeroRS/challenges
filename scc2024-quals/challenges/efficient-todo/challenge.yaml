name: efficient-todo
fullName: Efficient ToDo
description: I found a faster way to implement a personal todo list, can you tell
  me if it is safe please!
categories:
- pwn
authors:
- mirko
flags:
- name: main
  body: 0hhhhKn3WiT_1t_1s_n07_7h47_s4f3!
instancing: true
files:
- source/todo
- source/libc.so.6
- source/libs/libc.so.6
- source/libs/ld-linux-x86-64.so.2
- public/build-docker.sh
- public/flag.txt
- source/ld-linux-x86-64.so.2
- public/Dockerfile
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1337
    type: netcat
    expose: true
  flags:
  - name: main
    file: /home/user/flag
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: source/libc.so.6
    target: /solution/libc.so.6
