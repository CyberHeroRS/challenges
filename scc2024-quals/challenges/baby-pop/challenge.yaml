name: baby-pop
fullName: babyPOP
description: Fellow pwners love to ROP.. let's introduce it to the web!
categories:
- web
authors:
- kodz
flags:
- name: main
  body: W3lc0m3_t0_pHp_P0P_G4dg3ts
instancing: true
files:
- public/app.Dockerfile
- public/build-docker.sh
- source/config/nginx/default.conf
- public/config/db_init/init.sql
- source/db.Dockerfile
- public/docker-compose.yml
- source/src/classes/Logger.php
- source/src/register.php
- public/src/config.php
- source/src/logout.php
- source/src/login.php
- public/src/hidden/flag.php
- source/src/index.php
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: app.Dockerfile
  ports:
  - name: main
    containerPort: 80
    type: http
    expose: true
  flags:
  - name: main
    env: FLAG
- name: db
  image:
    type: dockerfile
    context: source
    path: db.Dockerfile
  env:
  - name: MYSQL_ROOT_PASSWORD
    value: root
  - name: MYSQL_DATABASE
    value: babyPOP
  - name: MYSQL_USER
    value: babypop
  - name: MYSQL_PASSWORD
    value: 2?DtQ`4%J_p:4chq
  ports:
  - name: mysql
    containerPort: 3306
    type: netcat
    expose: false
