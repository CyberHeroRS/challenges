<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇷🇸 Flags 4 Everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.3.1/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.3.1/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
</head>

<body>
    <div class="card">
        <h1>Flags 4 Everyone! 🇷🇸 🇸🇨 🇨🇭</h1>
        <p>This is where I keep all my flags. I can show you some, but not all!</p>

        <pre><code class="language-sql">{{ query }}</code></pre>
        <form method="get">
            <input type="text" name="search" />
            <button>Search flags</button>
        </form>

        {% if flags is defined %}
        {% for flag in flags %}
        <span class="flag">{{ flag.flag }}</span>
        {% endfor %}
        {% endif %}
    </div>
</body>

</html>
