name: shortnote
fullName: ShortNote
description: I've developed a simple note-taking application, with big plans to expand
  and elevate it to the next level in the future. Could you lend your expertise and
  provide a review?
categories:
- web
authors:
- kodz
flags:
- name: main
  body: D0nt_W0rrY_L000ng_N0te_1s_C0m1ng_S00n
instancing: true
files:
- source/Dockerfile
- public/build-docker.sh
- source/src/package.json
- source/src/package-lock.json
- source/src/app.js
- source/src/views/index.ejs
- source/src/views/visit.ejs
- source/src/views/checkNote.ejs
- source/src/static/styles.css
- source/src/static/checkNote.css
- public/src/bot.js
- public/src/.env
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 7777
    type: http
    expose: true
  flags:
  - name: main
    env: FLAG
