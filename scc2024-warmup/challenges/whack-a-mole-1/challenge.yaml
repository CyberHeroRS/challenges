name: whack-a-mole-1
fullName: Whack A Mole 1
description: I have 5 moles in my backyard. They use a specific pattern to choose
  which hole to appear in. Sadly, there are too many holes to guess. Can you help
  me identify their pattern? If successful, I will reward you with a flag.
categories:
- crypto
authors:
- mirko
flags:
- name: main
  body: d1d_y0u_b34t_th3m0le??!?!?
instancing: false
files:
- public/server.py
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1337
    type: netcat
    expose: true
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
