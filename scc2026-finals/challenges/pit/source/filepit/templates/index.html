<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filepit - {{ base_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div id="file-list" class="card shadow-sm">
      {% include "partials/browse.html" %}
    </div>
  </div>

  <div id="modal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('htmx:afterSwap', function(evt) {
      var modalEl = document.querySelector('.modal');
      if (modalEl) {
        var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
        modalEl.addEventListener('hidden.bs.modal', function() {
          modalEl.closest('#modal-container').innerHTML = '';
        });
      }
    });
    document.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target.id === 'file-list') {
        var modalEl = document.querySelector('.modal.show');
        if (modalEl) {
          var modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) {
            modal.hide();
          }
        }
      }
    });
  </script>
</body>
</html>
