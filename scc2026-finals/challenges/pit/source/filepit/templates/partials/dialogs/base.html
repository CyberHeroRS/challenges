<div class="modal fade" id="dialogModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form hx-post="{{ action_url }}" hx-target="#file-list" hx-swap="innerHTML" {% if multipart %}hx-encoding="multipart/form-data"{% endif %}>
        <div class="modal-header">
          <h5 class="modal-title">{% block title %}Dialog{% endblock %}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          {% block body %}{% endblock %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-{% block btn_class %}primary{% endblock %}">{% block submit_text %}Submit{% endblock %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
