name: based-errors
fullName: based-errors
description: 'Why does Sentry need 8 GB of RAM? basedErrors can run on a shared webhost from 2001.

  '
categories:
- web
authors:
- franga2000
flags:
- name: flag
  body: error_based_
instancing: true
services:
- name: based-errors
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  env:
  - name: MYSQL_HOST
    value: db
  - name: MYSQL_DATABASE
    value: mydb
  - name: MYSQL_USER
    value: user
  - name: MYSQL_PASSWORD
    value: userpassword
  flags:
  - name: flag
    env: FLAG
  ports:
  - name: http
    containerPort: 80
    expose: true
    type: http
- name: db
  image:
    type: image
    image: docker.io/mariadb:12
  env:
  - name: MARIADB_DATABASE
    value: mydb
  - name: MARIADB_USER
    value: user
  - name: MARIADB_PASSWORD
    value: userpassword
  - name: MARIADB_ROOT_PASSWORD
    value: rootpassword
  ports:
  - name: mysql
    containerPort: 3306
    expose: false
    type: netcat
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
files:
- source/docker-compose.yml
- source/Dockerfile
- source/entrypoint.sh
- source/.htpasswd
- source/www/custom_fields.php
- source/www/db.php
- source/www/error.php
- source/www/errors.php
- source/www/footer.php
- source/www/header.php
- source/www/.htaccess
- source/www/index.php
- source/www/login.php
- source/www/project.php
- source/www/snippet.php
- source/www/style.css
- source/www/submit.php
- source/www/test.php
- source/www/user.php
