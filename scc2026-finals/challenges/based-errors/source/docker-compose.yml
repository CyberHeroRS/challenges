services:
  php:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
      FLAG: ${FLAG}
  db:
    image: docker.io/mariadb:12
    restart: always
    environment:
      MARIADB_DATABASE: mydb
      MARIADB_USER: user
      MARIADB_PASSWORD: userpassword
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
