<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .navbar {
            background-color: #0d6efd !important;
        }

        .navbar .nav-link {
            color: #ffffff !important;
            font-weight: 700;
        }

        .navbar .nav-link:hover {
            color: #e9f2ff !important;
        }

        .hero-section {
            padding: 80px 0;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
        }

        .hero-text {
            font-size: 1.1rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom shadow-sm py-3">
        <div class="container">
            
            <div class="collapse navbar-collapse justify-content-center show" id="navbarNav">
                <ul class="navbar-nav gap-5">
                    
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/services">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact Us</a>
                    </li>
                    
                    {% if is_admin %}
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/contacts">Admin Contacts</a>
                    </li>
                    {% endif %}

                </ul>
            </div>

        </div>
    </nav>

    <!-- Body Content -->
    <section class="hero-section">
        <div class="container">

            <div class="row">

                <div class="col-lg-8 offset-lg-2">
                    <h1 class="hero-title mb-4 text-center">
                        Contact Us
                    </h1>

                    <p class="hero-text mb-5 text-center">
                        Have a question or want to get in touch? Fill out the form below and we'll get back to you as soon as possible.
                    </p>

                    <form method="POST" action="/contact">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Send Message</button>
                        </div>
                    </form>
                </div>

            </div>

        </div>
    </section>

</body>
</html>
