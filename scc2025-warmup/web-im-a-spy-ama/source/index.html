<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I'm a Spy AMA</title>
    <style>
      body {
        background-color: #000;
        color: #0f0;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        border: 2px solid #0f0;
        padding: 20px;
        border-radius: 8px;
        background-color: #111;
        box-shadow: 0 0 10px #0f0;
      }
      h1 {
        margin-bottom: 10px;
      }
      p {
        margin: 5px 0 20px;
      }
      form {
        margin-bottom: 20px;
      }
      input[type="text"] {
        width: 300px;
        padding: 10px;
        border: 2px solid #0f0;
        background: #000;
        color: #0f0;
        font-size: 16px;
        border-radius: 4px;
      }
      input[type="submit"] {
        margin-top: 10px;
        padding: 10px 20px;
        border: none;
        background: #0f0;
        color: #000;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s;
      }
      input[type="submit"]:hover {
        background: #0c0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>I'm a Spy AMA</h1>
      <p>Ask me anything... but be careful, secrets are dangerous.</p>
      <form action="/" method="POST">
        <input
          type="text"
          name="question"
          placeholder="Enter your secret question"
          required
        />
        <br />
        <input type="submit" value="Submit" />
      </form>
    </div>
  </body>
</html>
