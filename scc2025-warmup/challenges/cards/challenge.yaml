name: cards
fullName: Cards
description: Do you feel lucky, punk?
categories:
- pwn
authors:
- k4
flags:
- name: main
  body: luck_is_not_the_only_f4ctor
instancing: true
files:
- source/docker-compose.yml
- public/Dockerfile
- build://participant/chal
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1337
    type: netcat
    expose: true
  flags:
  - name: main
    env: FLAG
build:
- name: participant
  image:
    type: dockerfile
    context: source
    path: Dockerfile
    target: participant
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: build://participant/chal
    target: /solution/chal
