name: cards-act-ii
fullName: Cards, Act II
description: Another card game to decide your life. Maybe you should start avoiding
  dimly lit rooms...
categories:
- crypto
authors:
- pseudoleon
flags:
- name: main
  body: subroups_are_groups_too
instancing: true
files:
- public/build_docker.sh
- source/cards.py
- public/Dockerfile
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 13300
    type: netcat
    expose: true
  flags:
  - name: main
    env: FLAG
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
