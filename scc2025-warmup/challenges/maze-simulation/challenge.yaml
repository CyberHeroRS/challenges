name: maze-simulation
fullName: Maze Simulation
description: Can you think outside of the box?
categories:
- pwn
authors:
- k4
flags:
- name: main
  body: h0w_d0_1_f0rm4t_th1s?_s50r3b04rd
instancing: true
files:
- source/docker-compose.yml
- public/Dockerfile
- build://participant/chal
services:
- name: app
  image:
    type: dockerfile
    context: source
    path: Dockerfile
  ports:
  - name: main
    containerPort: 1337
    type: netcat
    expose: true
  flags:
  - name: main
    env: FLAG
build:
- name: participant
  image:
    type: dockerfile
    context: source
    path: Dockerfile
    target: participant
test:
- name: solve
  image:
    type: dockerfile
    context: solution
    path: Dockerfile
  mounts:
  - source: build://participant/chal
    target: /solution/chal
