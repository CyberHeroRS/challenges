<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ffcc00;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input {
            background-color: #222;
            color: #fff;
            width: 300px;
            text-align: center;
        }
        button {
            background-color: #ffcc00;
            color: black;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff9900;
        }
        #results {
            margin-top: 20px;
            font-size: 18px;
            color: #ffffff;
        }

        .btn-report {
            margin-top: 20px;
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>The page is still in pR0g|53355s...</h1>

    <h2>Search Page</h2>
    <form id="searchForm" method="GET">
        <input type="text" id="query" name="query" placeholder="Search...">
        <button type="submit">Search</button>
    </form>

    <div id="results"></div>
    <button class="btn-report" onclick="reportURL()">Report This URL</button>

    <script>
        function reportURL() {
        const currentURL = window.location.href;

        fetch('/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: currentURL })
        })
        .then(response => response.text())
        .then(data => alert('Reported: ' + currentURL))
        .catch(error => alert('Error reporting URL'));
        }

        const params = new URLSearchParams(window.location.search);
        const query = params.get('query');

        if (query) {
            document.getElementById('results').innerHTML = `<p>Result for:</p> ${query}`;
        }
    </script>

</body>
</html>
